<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>4年 小数の計算練習（試作）</title>
    <style>
      :root {
        --bg: #eef5f9;
        --card: #ffffff;
        --ink: #22303c;
        --ink-soft: #4d6373;
        --line: #d7e4ec;
        --primary: #1f7ac0;
        --primary-dark: #16649e;
        --primary-soft: #e3f1fa;
        --amber: #f5a623;
        --amber-soft: #fdf0d5;
        --good: #1e9e57;
        --good-soft: #e2f5e9;
        --bad: #d9534f;
        --bad-soft: #fbe9e8;
        --riku: #2e9e5b;
        --riku-soft: #e4f4ea;
        --sora: #2b8fd6;
        --sora-soft: #e3f1fb;
        --tsuki: #dd8a12;
        --tsuki-soft: #fdf0da;
        --kai: #0f9488;
        --kai-soft: #def3f0;
        --radius: 18px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 16px 16px 40px;
      }

      /* ---------- header ---------- */
      header.top {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 6px 0 18px;
      }
      header.top h1 {
        font-size: clamp(24px, 5vw, 34px);
        margin: 0;
        letter-spacing: 0.02em;
      }
      .chip-grade {
        background: var(--primary);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        padding: 7px 14px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .chip-proto {
        background: var(--amber-soft);
        color: #8a5c00;
        border: 2px solid var(--amber);
        font-size: 15px;
        font-weight: 700;
        padding: 5px 14px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .lead {
        color: var(--ink-soft);
        font-size: 17px;
        margin: 0 0 18px;
        line-height: 1.6;
      }

      /* ---------- top: type cards ---------- */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 560px) {
        .grid { grid-template-columns: 1fr; }
      }
      .type-card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: var(--radius);
        padding: 20px;
        text-align: left;
        cursor: pointer;
        font-family: inherit;
        color: var(--ink);
        width: 100%;
        transition: border-color 0.15s ease, transform 0.1s ease;
      }
      .type-card:active { transform: scale(0.99); }
      .type-card .symbol {
        font-size: 40px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 8px;
      }
      .type-card .tname {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 4px;
      }
      .type-card .tdesc {
        font-size: 15px;
        color: var(--ink-soft);
        margin: 0 0 14px;
        line-height: 1.5;
      }
      .type-card .start {
        display: inline-block;
        margin-top: 14px;
        background: var(--primary);
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        padding: 10px 22px;
        border-radius: 999px;
      }
      .pending {
        display: inline-block;
        margin-left: 8px;
        background: var(--bad-soft);
        color: var(--bad);
        font-size: 14px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        vertical-align: middle;
      }

      /* ---------- navi chip ---------- */
      .navi {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        border-radius: 999px;
        padding: 7px 14px 7px 8px;
        font-size: 15px;
        line-height: 1.35;
        max-width: 100%;
      }
      .navi .dot {
        flex: 0 0 auto;
        width: 34px; height: 34px;
        border-radius: 50%;
        color: #fff;
        font-weight: 800;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .navi b { font-size: 16px; }
      .navi .hint { color: var(--ink-soft); }
      .navi.riku  { background: var(--riku-soft); }  .navi.riku .dot  { background: var(--riku); }
      .navi.sora  { background: var(--sora-soft); }  .navi.sora .dot  { background: var(--sora); }
      .navi.tsuki { background: var(--tsuki-soft); } .navi.tsuki .dot { background: var(--tsuki); }
      .navi.kai   { background: var(--kai-soft); }   .navi.kai .dot   { background: var(--kai); }

      /* ---------- menu buttons ---------- */
      .menu-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 14px;
      }
      @media (max-width: 560px) {
        .menu-row { grid-template-columns: 1fr; }
      }
      .menu-btn {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: var(--radius);
        padding: 18px 20px;
        font-family: inherit;
        font-size: 19px;
        font-weight: 800;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        min-height: 64px;
      }
      .menu-btn small {
        display: block;
        font-size: 14px;
        font-weight: 400;
        color: var(--ink-soft);
        margin-top: 4px;
      }
      .menu-btn .count {
        background: var(--bad);
        color: #fff;
        font-size: 15px;
        border-radius: 999px;
        padding: 2px 10px;
        margin-left: 6px;
        vertical-align: middle;
      }

      /* ---------- practice ---------- */
      .panel {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: var(--radius);
        padding: 22px;
      }
      .quiz-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .progress-label {
        font-size: 17px;
        font-weight: 700;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .progress-bar {
        height: 12px;
        background: var(--primary-soft);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 22px;
      }
      .progress-bar > div {
        height: 100%;
        background: var(--primary);
        border-radius: 999px;
        transition: width 0.25s ease;
      }
      .problem {
        text-align: center;
        font-size: clamp(38px, 9vw, 56px);
        font-weight: 800;
        letter-spacing: 0.03em;
        margin: 10px 0 20px;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- step UI ---------- */
      .step-label {
        text-align: center;
        font-size: 16px;
        font-weight: 800;
        color: var(--primary-dark);
        margin: 2px 0 6px;
      }
      .step-prompt {
        text-align: center;
        font-size: clamp(19px, 4.4vw, 23px);
        font-weight: 700;
        line-height: 1.65;
        margin: 8px auto 18px;
        max-width: 640px;
      }

      /* ---------- hissan (筆算) ---------- */
      .hissan {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 6px 0 4px;
        font-variant-numeric: tabular-nums;
        user-select: none;
      }
      .hrow { display: flex; align-items: flex-end; }
      .hcell {
        width: 48px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 800;
        position: relative;
        border-radius: 8px;
      }
      .hcell.sign {
        width: 34px;
        font-size: 28px;
        color: var(--ink-soft);
      }
      .hcell.carry-cell {
        height: 22px;
        font-size: 16px;
        font-weight: 800;
        color: var(--bad);
      }
      .hrow.answer-row .hcell {
        border-top: 3px solid var(--ink);
        border-radius: 0 0 8px 8px;
      }
      .hrow.answer-row .hcell.current {
        background: var(--amber-soft);
        box-shadow: inset 0 0 0 3px var(--amber);
        border-radius: 8px;
      }
      .hrow.answer-row .hcell.done { color: var(--primary-dark); }
      .hpoint {
        width: 18px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 800;
      }
      .hpoint.small { height: 22px; font-size: 16px; }
      .hcell .mini-above {
        position: absolute;
        top: -13px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 15px;
        font-weight: 800;
        color: var(--primary-dark);
        white-space: nowrap;
      }
      .hcell .mini-borrow {
        position: absolute;
        top: -13px;
        left: 2px;
        font-size: 15px;
        font-weight: 800;
        color: var(--bad);
        white-space: nowrap;
      }
      .hcell .struck { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-soft); }

      /* ---------- point picker (小数点決め) ---------- */
      .point-picker {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 8px 0 6px;
        flex-wrap: nowrap;
      }
      .digit-tile {
        width: 48px;
        height: 64px;
        font-size: 36px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f9fc;
        border: 2px solid var(--line);
        border-radius: 10px;
        font-variant-numeric: tabular-nums;
      }
      .gap-btn {
        width: 44px;
        height: 64px;
        border: none;
        background: transparent;
        cursor: pointer;
        position: relative;
        padding: 0;
        flex: 0 0 auto;
      }
      .gap-btn::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        border: 3px dashed #9db4c2;
        border-radius: 50%;
      }
      .gap-btn:active::after { border-color: var(--primary); }
      .gap-btn.chosen::after {
        border: 3px solid var(--good);
        background: var(--good);
        width: 14px;
        height: 14px;
      }
      .gap-btn:disabled { cursor: default; }

      .answer-box {
        margin: 0 auto 18px;
        max-width: 420px;
        min-height: 78px;
        border: 3px solid var(--primary);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        background: #fbfdff;
        padding: 6px 12px;
        word-break: break-all;
      }
      .answer-box.empty { color: #9db4c2; font-size: 22px; font-weight: 400; }
      .answer-box.good { border-color: var(--good); background: var(--good-soft); }
      .answer-box.bad  { border-color: var(--bad);  background: var(--bad-soft); }

      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        max-width: 420px;
        margin: 0 auto;
      }
      .keypad button {
        min-height: 62px;
        font-size: 27px;
        font-weight: 700;
        font-family: inherit;
        background: #f4f9fc;
        border: 2px solid var(--line);
        border-radius: 14px;
        color: var(--ink);
        cursor: pointer;
      }
      .keypad button:active { background: var(--primary-soft); }
      .keypad button.util { font-size: 20px; background: #fdf6e3; }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .btn {
        font-family: inherit;
        font-size: 19px;
        font-weight: 800;
        border-radius: 999px;
        padding: 14px 30px;
        min-height: 56px;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .btn.primary { background: var(--primary); color: #fff; }
      .btn.primary:active { background: var(--primary-dark); }
      .btn.ghost {
        background: var(--card);
        border-color: var(--line);
        color: var(--ink-soft);
      }
      .btn:disabled { opacity: 0.45; cursor: default; }

      .feedback {
        margin-top: 20px;
        border-radius: 14px;
        padding: 16px 18px;
        font-size: 18px;
        line-height: 1.65;
        display: none;
      }
      .feedback.show { display: block; }
      .feedback.good { background: var(--good-soft); }
      .feedback.bad  { background: var(--bad-soft); }
      .feedback.info { background: var(--primary-soft); }
      .feedback .verdict { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
      .feedback.good .verdict { color: var(--good); }
      .feedback.bad .verdict  { color: var(--bad); }
      .feedback.info .verdict { color: var(--primary-dark); }

      /* ---------- result / records ---------- */
      .big-result {
        text-align: center;
        font-size: clamp(26px, 6vw, 36px);
        font-weight: 800;
        margin: 8px 0 6px;
      }
      .result-msg {
        text-align: center;
        font-size: 18px;
        color: var(--ink-soft);
        line-height: 1.7;
        margin: 0 0 8px;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 6px;
      }
      @media (max-width: 560px) {
        .stat-grid { grid-template-columns: 1fr; }
      }
      .stat-card {
        border: 2px solid var(--line);
        border-radius: var(--radius);
        padding: 18px 20px;
        background: var(--card);
      }
      .stat-card h3 {
        margin: 0 0 10px;
        font-size: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .stat-card .row {
        display: flex;
        justify-content: space-between;
        font-size: 17px;
        padding: 5px 0;
        border-top: 1px dashed var(--line);
      }
      .stat-card .row b { font-variant-numeric: tabular-nums; }
      .colorbar {
        width: 14px; height: 14px;
        border-radius: 4px;
        display: inline-block;
      }
      .back-row { margin-bottom: 14px; }
      .hidden { display: none !important; }
      footer.note {
        margin-top: 26px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="wrap">

      <!-- ============ トップ画面 ============ -->
      <section id="view-top">
        <header class="top">
          <h1>小数の 計算練習</h1>
          <span class="chip-grade">4年生・算数</span>
          <span class="chip-proto">試作</span>
        </header>
        <p class="lead">小数の 計算だけを 練習する ページです。やりたい 練習を えらんでね。1回は 10問です。</p>

        <div class="grid" id="type-grid"></div>

        <div class="menu-row">
          <button class="menu-btn" id="btn-tokkun">
            とっくん（まちがい直し）<span class="count hidden" id="tokkun-count">0</span>
            <small>まちがえた 問題に もう一度 チャレンジ。正解すると きえるよ。</small>
          </button>
          <button class="menu-btn" id="btn-records">
            れんしゅうの きろく
            <small>種類ごとに、といた 問題数と 正解数が 見られます。</small>
          </button>
        </div>

        <footer class="note">まちがえた 問題と きろくは、この タブレットの 中だけに 保存されます。</footer>
      </section>

      <!-- ============ 練習画面 ============ -->
      <section id="view-quiz" class="hidden">
        <div class="back-row">
          <button class="btn ghost" id="btn-quit">← トップへ もどる</button>
        </div>
        <div class="panel">
          <div class="quiz-head">
            <span id="quiz-navi"></span>
            <span class="progress-label" id="progress-label">1 / 10 もん</span>
          </div>
          <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

          <div class="problem hidden" id="problem-text">1.5 ＋ 2.3 ＝ ？</div>

          <div class="hissan hidden" id="hissan"></div>

          <div class="step-label" id="step-label"></div>
          <div class="step-prompt" id="step-prompt"></div>

          <div class="point-picker hidden" id="point-picker"></div>

          <div class="answer-box empty" id="answer-box">ここに こたえが 入るよ</div>

          <div class="keypad" id="keypad">
            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
            <button type="button" data-key="." aria-label="小数点">.</button>
            <button type="button" data-key="0">0</button>
            <button type="button" class="util" data-key="back" aria-label="1文字 けす">けす</button>
          </div>

          <div class="actions">
            <button class="btn primary" id="btn-check">こたえる</button>
            <button class="btn primary hidden" id="btn-next">つぎへ →</button>
          </div>

          <div class="feedback" id="feedback">
            <div class="verdict" id="feedback-verdict"></div>
            <div id="feedback-body"></div>
          </div>
        </div>
      </section>

      <!-- ============ 結果画面 ============ -->
      <section id="view-result" class="hidden">
        <div class="panel">
          <p class="big-result" id="result-title">10もん中 8もん せいかい！</p>
          <p class="result-msg" id="result-msg"></p>
          <div class="actions">
            <button class="btn primary" id="btn-again">もう一度 れんしゅう</button>
            <button class="btn ghost" id="btn-result-tokkun">とっくんへ</button>
            <button class="btn ghost" id="btn-result-top">トップへ</button>
          </div>
        </div>
      </section>

      <!-- ============ 記録画面 ============ -->
      <section id="view-records" class="hidden">
        <div class="back-row">
          <button class="btn ghost" id="btn-records-back">← トップへ もどる</button>
        </div>
        <div class="panel" style="background:transparent;border:none;padding:0;">
          <h2 style="font-size:24px;margin:4px 0 14px;">れんしゅうの きろく</h2>
          <div class="stat-grid" id="stat-grid"></div>
        </div>
      </section>

    </div>

    <script>
      "use strict";

      /* ================= 種類の定義 ================= */
      var TYPES = {
        add: {
          label: "小数の たし算",
          symbol: "＋",
          desc: "小数第1位・第2位までの たし算",
          navi: "りく", naviClass: "riku",
          hint: "小数点を そろえて 計算しよう",
          explain: "小数点の 位置を そろえて、0.1の位、0.01の位どうしを たします。位を そろえるのが ポイントです。"
        },
        sub: {
          label: "小数の ひき算",
          symbol: "－",
          desc: "小数第1位・第2位までの ひき算",
          navi: "そら", naviClass: "sora",
          hint: "小さい位から 順に ひいていこう",
          explain: "小数点を そろえて、0.01の位、0.1の位の 順に ひきます。ひけない ときは、上の位から かりてきます。"
        },
        mul: {
          label: "小数 × 整数",
          symbol: "×",
          desc: "小数に 整数を かける かけ算",
          navi: "つき", naviClass: "tsuki",
          hint: "整数の かけ算と 同じように 計算しよう",
          explain: "まず 小数点を ないものとして 整数の かけ算を します。それから、もとの 小数と 同じ 位置に 小数点を もどします。"
        },
        div: {
          label: "小数 ÷ 整数",
          symbol: "÷",
          desc: "わり切れる 問題だけの わり算",
          navi: "かい", naviClass: "kai",
          hint: "商の 小数点は わられる数と そろえるよ",
          explain: "商の 小数点は、わられる数の 小数点と 同じ 位置に 打ちます。0.1の位まで わり切れない ときは、0.01の位まで 計算します。"
        }
      };
      var TYPE_KEYS = ["add", "sub", "mul", "div"];

      /* ================= 保存（この端末の中だけ） ================= */
      var LS_MISTAKES = "shosuRenshu.mistakes.v1";
      var LS_STATS = "shosuRenshu.stats.v1";

      function loadJSON(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fallback;
          var v = JSON.parse(raw);
          return v == null ? fallback : v;
        } catch (e) { return fallback; }
      }
      function saveJSON(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
      }
      function loadMistakes() {
        var m = loadJSON(LS_MISTAKES, []);
        return Array.isArray(m) ? m : [];
      }
      function loadStats() {
        var s = loadJSON(LS_STATS, {});
        TYPE_KEYS.forEach(function (k) {
          if (!s[k] || typeof s[k].total !== "number") s[k] = { total: 0, correct: 0 };
        });
        return s;
      }

      /* ================= 数値ユーティリティ =================
         小数は 100倍した整数（＝0.01単位）で計算し、
         浮動小数点の誤差で判定がずれないようにする。 */
      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      // 0.01単位の整数 → 表示用文字列（末尾の0は落とす）
      function fmt(scaled) {
        var neg = scaled < 0;
        var v = Math.abs(scaled);
        var intPart = Math.floor(v / 100);
        var frac = v % 100;
        var out;
        if (frac === 0) out = String(intPart);
        else if (frac % 10 === 0) out = intPart + "." + (frac / 10);
        else out = intPart + "." + (frac < 10 ? "0" : "") + frac;
        return (neg ? "-" : "") + out;
      }

      // 小数点以下の桁数（0.01単位の整数に対して 0〜2）
      function placesOf(scaled) {
        var v = Math.abs(scaled);
        if (v % 100 === 0) return 0;
        if (v % 10 === 0) return 1;
        return 2;
      }
      // 小数点を取った形の整数（例：2.40→24、2.05→205）
      function intDigitsOf(scaled) {
        var d = Math.abs(scaled);
        while (d !== 0 && d % 10 === 0) d = d / 10;
        return d;
      }
      // scaled（0.01単位）の k 位の数字。k=0:0.01の位、1:0.1の位、2:1の位、3:10の位
      function digitAt(scaled, k) {
        return Math.floor(Math.abs(scaled) / Math.pow(10, k)) % 10;
      }
      function placeName(k) {
        var names = { 0: "0.01の位", 1: "0.1の位", 2: "1の位", 3: "10の位", 4: "100の位" };
        return names[k] || "";
      }

      /* ================= 問題生成 ================= */
      // たし算・ひき算用の小数ペア（0.01単位の整数で返す）
      function decimalPair() {
        var style = pick([1, 1, 2, 2, 3]); // 1:第1位まで 2:第2位まで 3:まざった形
        var a, b;
        if (style === 1) {
          a = randInt(1, 99) * 10;
          b = randInt(1, 99) * 10;
        } else if (style === 2) {
          a = randInt(11, 999);
          b = randInt(11, 999);
          if (a % 10 === 0) a += randInt(1, 9);
          if (b % 10 === 0) b += randInt(1, 9);
        } else {
          a = randInt(1, 99) * 10;
          b = randInt(11, 999);
          if (b % 10 === 0) b += randInt(1, 9);
        }
        return [a, b];
      }

      function genProblem(type) {
        var a, b, ans, expr;
        if (type === "add") {
          var p = decimalPair();
          a = p[0]; b = p[1]; ans = a + b;
          expr = fmt(a) + " ＋ " + fmt(b);
        } else if (type === "sub") {
          var q = decimalPair();
          a = Math.max(q[0], q[1]); b = Math.min(q[0], q[1]);
          if (a === b) a += 10;
          ans = a - b;
          expr = fmt(a) + " － " + fmt(b);
        } else if (type === "mul") {
          var m;
          if (Math.random() < 0.5) {
            a = randInt(2, 99) * 10;      // 小数第1位まで
          } else {
            a = randInt(12, 499);          // 小数第2位まで
            if (a % 10 === 0) a += randInt(1, 9);
          }
          if (a % 100 === 0) a += 10;      // 整数になってしまう形は避ける
          m = randInt(2, 9);
          b = m;
          ans = a * m;                     // 0.01単位 × 整数 ＝ 0.01単位
          expr = fmt(a) + " × " + m;
        } else { // div：わり切れる問題だけを作る（ステップ方式に合わせて組み立てる）
          // ステップ1で「小数点を取った形 ÷ わる数」が整数になるよう、
          // 商（整数として計算した形）→ わられる数の順に組み立てる。
          var d = randInt(2, 9);
          var pIdx = pick([1, 2]);         // わられる数の小数点以下の桁数
          var intQuot = 13, aInt = 26, guard = 0;
          do {
            intQuot = randInt(12, 120);
            aInt = intQuot * d;            // 小数点を取った形の わられる数
            guard++;
          } while ((aInt % 10 === 0 || aInt > 999) && guard < 500);
          if (aInt % 10 === 0 || aInt > 999) { d = 2; intQuot = 13; aInt = 26; }
          a = aInt * (pIdx === 2 ? 1 : 10); // 0.01単位に戻す
          b = d;
          ans = a / d;                      // 0.01単位の商（必ず整数になる）
          expr = fmt(a) + " ÷ " + d;
        }
        return {
          type: type,
          expr: expr,
          answer: ans, // 0.01単位の整数
          a: a,        // 0.01単位の整数（mul/div では 小数点のある数）
          b: b         // 0.01単位の整数（mul/div では 整数の相手）
        };
      }

      // 記録（expr 文字列）から問題を復元する（旧形式の記録用）
      function parseScaledStr(str) {
        var parts = String(str).split(".");
        var ip = parseInt(parts[0] || "0", 10);
        if (isNaN(ip)) return 0;
        var fr = parts[1] ? parseInt((parts[1] + "00").slice(0, 2), 10) : 0;
        return ip * 100 + (isNaN(fr) ? 0 : fr);
      }
      function problemFromRecord(m) {
        if (typeof m.a === "number" && typeof m.b === "number") {
          return { type: m.type, expr: m.expr, answer: m.answer, a: m.a, b: m.b };
        }
        var tokens = String(m.expr).split(" ");
        if (tokens.length < 3) return null;
        var a = parseScaledStr(tokens[0]);
        var b = (m.type === "mul" || m.type === "div") ? parseInt(tokens[2], 10) : parseScaledStr(tokens[2]);
        if (isNaN(b)) return null;
        return { type: m.type, expr: m.expr, answer: m.answer, a: a, b: b };
      }

      /* ================= ステップ列の生成 =================
         表示するステップと、最終的な答えが食い違わないよう、
         問題の生成と同時に「各ステップの正解値」を作る。 */
      function buildSteps(p) {
        if (p.type === "add" || p.type === "sub") return buildHissanSteps(p);
        if (p.type === "mul" || p.type === "div") return buildPointSteps(p);
        return null;
      }

      // たし算・ひき算：筆算ステップ
      function buildHissanSteps(p) {
        var a = p.a, b = p.b;
        var frac = Math.max(placesOf(a), placesOf(b));
        if (frac === 0) frac = 1;
        var kMin = 2 - frac;
        var K = 2;
        [a, b, p.answer].forEach(function (v) {
          for (var k = 2; k <= 5; k++) if (digitAt(v, k) > 0 && k > K) K = k;
        });
        var steps = [];
        var carry = 0, borrow = 0;
        var pointIndex = -1;
        for (var col = kMin; col <= K; col++) {
          var da = digitAt(a, col), db = digitAt(b, col);
          if (p.type === "add") {
            var sum = da + db + carry;
            steps.push({
              kind: "digit", col: col, da: da, db: db,
              carryIn: carry, sum: sum,
              expect: sum % 10, carryOut: sum >= 10 ? 1 : 0
            });
            carry = sum >= 10 ? 1 : 0;
          } else {
            var daEff = da - borrow;
            var borrowed = daEff < db;
            var topDigit = borrowed ? daEff + 10 : daEff;
            steps.push({
              kind: "digit", col: col, da: da, db: db,
              borrowIn: borrow, daEff: daEff,
              borrowed: borrowed, topDigit: topDigit,
              expect: topDigit - db, borrowOut: borrowed ? 1 : 0
            });
            borrow = borrowed ? 1 : 0;
          }
          if (col === 1) {
            pointIndex = steps.length;
            steps.push({ kind: "hissan-point" });
          }
        }
        p.meta = { K: K, kMin: kMin, pointIndex: pointIndex };
        return steps;
      }

      // 小数×整数・小数÷整数：小数点の位置決めステップ
      function buildPointSteps(p) {
        var intA = intDigitsOf(p.a);
        var places = placesOf(p.a);
        var intRes;
        if (p.type === "mul") {
          intRes = intA * p.b;
        } else {
          if (intA % p.b !== 0) return null; // 旧形式などで割り切れない記録は扱えない
          intRes = intA / p.b;
        }
        var digits = String(intRes);
        var dispLen = Math.max(digits.length, places + 1);
        while (digits.length < dispLen) digits = "0" + digits;
        return [
          { kind: "intcalc", x: intA, y: p.b, expect: intRes },
          { kind: "count", expect: places },
          { kind: "point", digits: digits, places: places, correctGap: dispLen - places, intRes: intRes }
        ];
      }

      /* ================= 画面管理 ================= */
      var views = ["view-top", "view-quiz", "view-result", "view-records"];
      function showView(id) {
        views.forEach(function (v) {
          document.getElementById(v).classList.toggle("hidden", v !== id);
        });
        window.scrollTo(0, 0);
      }

      function naviHTML(type) {
        var t = TYPES[type];
        return '<span class="navi ' + t.naviClass + '">' +
          '<span class="dot">' + t.navi.charAt(0) + '</span>' +
          '<span><b>' + t.navi + '</b> <span class="hint">' + t.hint + '</span></span></span>';
      }

      /* ---------- トップ画面 ---------- */
      function renderTop() {
        var mistakes = loadMistakes();
        var grid = document.getElementById("type-grid");
        grid.innerHTML = "";
        TYPE_KEYS.forEach(function (key) {
          var t = TYPES[key];
          var pendingCount = mistakes.filter(function (m) { return m.type === key; }).length;
          var card = document.createElement("button");
          card.type = "button";
          card.className = "type-card";
          card.innerHTML =
            '<div class="symbol">' + t.symbol + '</div>' +
            '<p class="tname">' + t.label +
              (pendingCount > 0 ? '<span class="pending">とっくん待ち ' + pendingCount + 'もん</span>' : '') +
            '</p>' +
            '<p class="tdesc">' + t.desc + '</p>' +
            naviHTML(key) +
            '<br><span class="start">れんしゅう スタート →</span>';
          card.addEventListener("click", function () { startPractice(key); });
          grid.appendChild(card);
        });
        var total = mistakes.length;
        var badge = document.getElementById("tokkun-count");
        badge.textContent = total;
        badge.classList.toggle("hidden", total === 0);
      }

      /* ---------- 記録画面 ---------- */
      function renderRecords() {
        var stats = loadStats();
        var mistakes = loadMistakes();
        var grid = document.getElementById("stat-grid");
        grid.innerHTML = "";
        var colors = { add: "var(--riku)", sub: "var(--sora)", mul: "var(--tsuki)", div: "var(--kai)" };
        TYPE_KEYS.forEach(function (key) {
          var t = TYPES[key];
          var s = stats[key];
          var pendingCount = mistakes.filter(function (m) { return m.type === key; }).length;
          var card = document.createElement("div");
          card.className = "stat-card";
          card.innerHTML =
            '<h3><span class="colorbar" style="background:' + colors[key] + '"></span>' + t.label + '</h3>' +
            '<div class="row"><span>といた 問題数</span><b>' + s.total + ' もん</b></div>' +
            '<div class="row"><span>正解数</span><b>' + s.correct + ' もん</b></div>' +
            '<div class="row"><span>とっくん待ち</span><b>' + pendingCount + ' もん</b></div>';
          grid.appendChild(card);
        });
      }

      /* ================= 練習の進行 ================= */
      var session = null;
      // session = { mode, type, problems, index, correctCount,
      //             stepIndex, stepInput, hadMistake, busy, timer, pointShown, chosenGap }

      function buildPracticeProblems(type) {
        var list = [];
        var seen = {};
        var guard = 0;
        while (list.length < 10 && guard < 200) {
          guard++;
          var p = genProblem(type);
          if (seen[p.expr]) continue;
          seen[p.expr] = true;
          list.push(p);
        }
        return list;
      }

      function clearTimer() {
        if (session && session.timer) {
          clearTimeout(session.timer);
          session.timer = null;
        }
      }

      function startPractice(type) {
        clearTimer();
        session = {
          mode: "practice",
          type: type,
          problems: buildPracticeProblems(type),
          index: 0,
          correctCount: 0,
          stepIndex: 0, stepInput: "", hadMistake: false,
          busy: false, timer: null, pointShown: false, chosenGap: -1
        };
        showView("view-quiz");
        renderQuestion();
      }

      function startTokkun() {
        clearTimer();
        var records = loadMistakes();
        var problems = [];
        var validRecords = [];
        records.forEach(function (m) {
          var p = problemFromRecord(m);
          if (p && buildSteps(p)) { problems.push(p); validRecords.push(m); }
        });
        if (validRecords.length !== records.length) {
          saveJSON(LS_MISTAKES, validRecords); // 扱えない古い記録は整理する
        }
        if (problems.length === 0) {
          showView("view-result");
          document.getElementById("result-title").textContent = "とっくん待ちの 問題は ありません";
          document.getElementById("result-msg").textContent = "まちがえた 問題は ぜんぶ 克服できています。この調子で れんしゅうを 続けよう。";
          document.getElementById("btn-again").classList.add("hidden");
          document.getElementById("btn-result-tokkun").classList.add("hidden");
          return;
        }
        // 並びをシャッフル
        for (var i = problems.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = problems[i]; problems[i] = problems[j]; problems[j] = tmp;
          var tmpR = validRecords[i]; validRecords[i] = validRecords[j]; validRecords[j] = tmpR;
        }
        session = {
          mode: "tokkun",
          type: null,
          problems: problems,
          index: 0,
          correctCount: 0,
          stepIndex: 0, stepInput: "", hadMistake: false,
          busy: false, timer: null, pointShown: false, chosenGap: -1
        };
        showView("view-quiz");
        renderQuestion();
      }

      function currentProblem() { return session.problems[session.index]; }
      function currentStep() {
        var p = currentProblem();
        return p.steps ? p.steps[session.stepIndex] : null;
      }

      function renderQuestion() {
        var p = currentProblem();
        if (!p.steps) p.steps = buildSteps(p);
        session.stepIndex = 0;
        session.stepInput = "";
        session.hadMistake = false;
        session.busy = false;
        session.pointShown = false;
        session.chosenGap = -1;
        document.getElementById("quiz-navi").innerHTML = naviHTML(p.type);
        document.getElementById("progress-label").textContent =
          (session.mode === "tokkun" ? "とっくん " : "") +
          (session.index + 1) + " / " + session.problems.length + " もん";
        document.getElementById("progress-fill").style.width =
          (session.index / session.problems.length * 100) + "%";
        renderStep();
      }

      /* ---------- ステップ表示 ---------- */
      function showFeedback(kind, verdict, body) {
        var fb = document.getElementById("feedback");
        fb.className = "feedback show " + kind;
        document.getElementById("feedback-verdict").textContent = verdict;
        document.getElementById("feedback-body").textContent = body;
      }
      function hideFeedback() {
        document.getElementById("feedback").className = "feedback";
      }

      function renderStep() {
        var p = currentProblem();
        var st = currentStep();
        var isHissan = (p.type === "add" || p.type === "sub");
        document.getElementById("problem-text").classList.toggle("hidden", isHissan);
        document.getElementById("hissan").classList.toggle("hidden", !isHissan);
        if (!isHissan) {
          document.getElementById("problem-text").textContent = p.expr + " ＝ ？";
        } else {
          renderHissan();
        }

        var label = document.getElementById("step-label");
        var prompt = document.getElementById("step-prompt");
        var picker = document.getElementById("point-picker");
        var box = document.getElementById("answer-box");
        var keypad = document.getElementById("keypad");
        var checkBtn = document.getElementById("btn-check");
        var nextBtn = document.getElementById("btn-next");
        nextBtn.classList.add("hidden");
        hideFeedback();

        if (!st) { completeProblem(); return; }

        if (st.kind === "hissan-point") {
          // 小数点をまっすぐ下ろす（自動ステップ）
          session.pointShown = true;
          renderHissan();
          label.textContent = "";
          prompt.textContent = "小数点を 打とう。";
          picker.classList.add("hidden");
          box.classList.add("hidden");
          keypad.classList.add("hidden");
          checkBtn.classList.add("hidden");
          showFeedback("info", "小数点", "小数点は、上の数と そろえて、まっすぐ 下に 下ろします。");
          session.busy = true;
          session.timer = setTimeout(function () {
            session.busy = false;
            session.stepIndex += 1;
            if (session.stepIndex >= currentProblem().steps.length) completeProblem();
            else renderStep();
          }, 1500);
          return;
        }

        if (st.kind === "point") {
          label.textContent = "ステップ " + (session.stepIndex + 1) + " ／ " + p.steps.length;
          prompt.textContent = (p.type === "mul")
            ? "答えに 小数点を 打とう。かけられる数の 小数点以下の 数と 同じだけ、答えも 小数点以下に します。小数点以下の 数が " + st.places + " つに なる 位置を タップしてね。"
            : "答えに 小数点を 打とう。わられる数の 小数点以下の 数と 同じだけ、答えも 小数点以下に します。小数点以下の 数が " + st.places + " つに なる 位置を タップしてね。";
          renderPointPicker(st);
          picker.classList.remove("hidden");
          box.classList.add("hidden");
          keypad.classList.add("hidden");
          checkBtn.classList.add("hidden");
          return;
        }

        // digit / intcalc / count：テンキー入力ステップ
        picker.classList.add("hidden");
        keypad.classList.remove("hidden");
        checkBtn.classList.remove("hidden");
        if (st.kind === "digit") {
          box.classList.add("hidden");
          label.textContent = "";
          prompt.textContent = digitPrompt(st, p);
          renderHissan();
        } else {
          box.classList.remove("hidden");
          label.textContent = "ステップ " + (session.stepIndex + 1) + " ／ " + p.steps.length;
          prompt.textContent = (st.kind === "intcalc") ? intcalcPrompt(st, p) : countPrompt(st, p);
          renderInput();
        }
      }

      function digitPrompt(st, p) {
        var place = placeName(st.col);
        if (p.type === "add") {
          return place + "を 計算しよう。" + st.da + " ＋ " + st.db +
            (st.carryIn ? " ＋ くり上がりの 1" : "") +
            " の 答えで、" + place + "に 書く 数字を 入れよう。";
        }
        if (st.borrowed) {
          var lead = st.daEff >= 0
            ? st.daEff + " から " + st.db + " は ひけないので、"
            : "そのままでは ひけないので、";
          return place + "：" + lead + "となりの位から 1 かりて " + st.topDigit +
            " に します。" + st.topDigit + " － " + st.db + " の 答えを 入れよう。";
        }
        var note = st.borrowIn
          ? "（前の位で かりたので、" + st.da + " は " + st.daEff + " に なっているよ）"
          : "";
        return place + "を 計算しよう。" + st.daEff + " － " + st.db +
          " の 答えを 入れよう。" + note;
      }

      function intcalcPrompt(st, p) {
        if (p.type === "mul") {
          return "まず、小数点を ないものとして 計算しよう。" + st.x + " × " + st.y + " ＝ ？";
        }
        return "まず、小数点を ないものとして 計算しよう。" + st.x + " ÷ " + st.y + " ＝ ？";
      }
      function countPrompt(st, p) {
        if (p.type === "mul") {
          return fmt(p.a) + " の 小数点以下の 数の かずを 数えよう。いくつ ある？";
        }
        return "わられる数 " + fmt(p.a) + " の 小数点以下の 数の かずを 数えよう。いくつ ある？";
      }

      /* ---------- 筆算の描画 ---------- */
      function renderHissan() {
        var p = currentProblem();
        if (!p.meta) return;
        var meta = p.meta;
        var wrap = document.getElementById("hissan");
        var cols = [];
        for (var k = meta.K; k >= meta.kMin; k--) cols.push(k);

        function stepOfCol(col) {
          for (var i = 0; i < p.steps.length; i++) {
            if (p.steps[i].kind === "digit" && p.steps[i].col === col) return i;
          }
          return -1;
        }
        function cellHTML(col, row) {
          var stIdx = stepOfCol(col);
          var st = stIdx >= 0 ? p.steps[stIdx] : null;
          var done = stIdx >= 0 && stIdx < session.stepIndex;
          var isCurrent = stIdx === session.stepIndex && currentStep() && currentStep().kind === "digit";
          var html = "";
          if (row === "carry") {
            var showCarry = false;
            if (p.type === "add" && st && st.carryIn === 1 && stIdx <= session.stepIndex && stIdx > 0) {
              // 前の位のステップが終わっていたら くり上がりの1 を見せる
              showCarry = (stIdx - 1) < session.stepIndex;
            }
            html = '<div class="hcell carry-cell">' + (showCarry ? "1" : "") + "</div>";
          } else if (row === "a") {
            var da = digitAt(p.a, col);
            var content = String(da);
            var mini = "";
            if (p.type === "sub" && st) {
              if (st.borrowIn === 1 && stIdx > 0 && (stIdx - 1) < session.stepIndex) {
                mini = '<span class="mini-above">' + (da - 1) + "</span>";
                content = '<span class="struck">' + da + "</span>";
              }
              if (st.borrowed && stIdx <= session.stepIndex) {
                mini += '<span class="mini-borrow">' + st.topDigit + "</span>";
              }
            }
            html = '<div class="hcell">' + mini + content + "</div>";
          } else if (row === "b") {
            var highestB = Math.max(2, highestCol(p.b));
            var inRange = col >= meta.kMin && col <= highestB;
            html = '<div class="hcell">' + (inRange ? digitAt(p.b, col) : "") + "</div>";
          } else { // answer
            var cls = "hcell";
            var val = "";
            if (done && st) { val = String(st.expect); cls += " done"; }
            if (isCurrent) {
              cls += " current";
              val = session.stepInput;
            }
            html = '<div class="' + cls + '">' + val + "</div>";
          }
          return html;
        }
        function highestCol(v) {
          for (var k = 5; k >= 2; k--) if (digitAt(v, k) > 0) return k;
          return 2;
        }
        function pointHTML(rowKind) {
          var show = rowKind === "answer" ? session.pointShown : rowKind !== "carry";
          var cls = "hpoint" + (rowKind === "carry" ? " small" : "");
          return '<div class="' + cls + '">' + (show ? "." : "") + "</div>";
        }
        function rowHTML(row) {
          var out = "";
          if (row === "a") out += '<div class="hcell sign"></div>';
          else if (row === "b") out += '<div class="hcell sign">' + (p.type === "add" ? "＋" : "－") + "</div>";
          else out += '<div class="hcell sign"></div>';
          cols.forEach(function (col) {
            out += cellHTML(col, row);
            if (col === 2) out += pointHTML(row);
          });
          return '<div class="hrow' + (row === "answer" ? " answer-row" : "") + '">' + out + "</div>";
        }
        wrap.innerHTML =
          rowHTML("carry") + rowHTML("a") + rowHTML("b") + rowHTML("answer");
      }

      /* ---------- 小数点決めの描画 ---------- */
      function renderPointPicker(st) {
        var picker = document.getElementById("point-picker");
        picker.innerHTML = "";
        var digits = st.digits.split("");
        for (var g = 0; g <= digits.length; g++) {
          (function (gap) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "gap-btn" + (session.chosenGap === gap ? " chosen" : "");
            btn.setAttribute("aria-label", "小数点を ここに打つ");
            btn.disabled = session.busy || session.chosenGap >= 0;
            btn.addEventListener("click", function () { tapGap(gap); });
            picker.appendChild(btn);
          })(g);
          if (g < digits.length) {
            var tile = document.createElement("div");
            tile.className = "digit-tile";
            tile.textContent = digits[g];
            picker.appendChild(tile);
          }
        }
      }

      function tapGap(gap) {
        if (!session || session.busy) return;
        var p = currentProblem();
        var st = currentStep();
        if (!st || st.kind !== "point") return;
        if (gap === st.correctGap) {
          session.chosenGap = gap;
          renderPointPicker(st);
          completeProblem();
        } else {
          markStepMistake();
          showFeedback("bad", "おしい！",
            "小数点以下の 数が " + st.places + " つに なる 位置だよ。右から " +
            st.places + " つ 数えて、もう一度 タップしてみよう。");
        }
      }

      /* ---------- 入力 ---------- */
      function renderInput() {
        var box = document.getElementById("answer-box");
        if (session.stepInput === "") {
          box.textContent = "ここに こたえが 入るよ";
          box.className = "answer-box empty";
        } else {
          box.textContent = session.stepInput;
          box.className = "answer-box";
        }
      }

      function pressKey(key) {
        if (!session || session.busy) return;
        var st = currentStep();
        if (!st) return;
        if (st.kind === "digit") {
          if (key === "back") session.stepInput = "";
          else if (key === ".") return;
          else session.stepInput = key;
          renderHissan();
        } else if (st.kind === "count") {
          if (key === "back") session.stepInput = "";
          else if (key === ".") return;
          else session.stepInput = key;
          renderInput();
        } else if (st.kind === "intcalc") {
          if (key === "back") {
            session.stepInput = session.stepInput.slice(0, -1);
          } else if (key === ".") {
            return;
          } else {
            if (session.stepInput.length >= 7) return;
            if (session.stepInput === "0") session.stepInput = key;
            else session.stepInput += key;
          }
          renderInput();
        }
      }

      /* ---------- ステップの判定 ---------- */
      function markStepMistake() {
        if (session.hadMistake) return;
        session.hadMistake = true;
        if (session.mode === "practice") {
          var p = currentProblem();
          var mistakes = loadMistakes();
          var exists = mistakes.some(function (m) { return m.type === p.type && m.expr === p.expr; });
          if (!exists) {
            mistakes.push({ type: p.type, expr: p.expr, answer: p.answer, a: p.a, b: p.b });
            saveJSON(LS_MISTAKES, mistakes);
          }
        }
      }

      function stepCorrectFeedback(st, p) {
        if (st.kind === "digit") {
          if (p.type === "add") {
            return st.carryOut
              ? "せいかい！" + st.sum + " だから " + st.expect + " を 書いて、1 を 次の位に くり上げたよ。"
              : "せいかい！";
          }
          return st.borrowed
            ? "せいかい！かりて " + st.topDigit + " － " + st.db + " ＝ " + st.expect + " だね。"
            : "せいかい！";
        }
        if (st.kind === "intcalc") {
          return "せいかい！" + st.x + (p.type === "mul" ? " × " : " ÷ ") + st.y + " ＝ " + st.expect + " だね。";
        }
        if (st.kind === "count") {
          return "せいかい！小数点以下の 数は " + st.expect + " つだね。";
        }
        return "せいかい！";
      }

      function stepWrongFeedback(st, p) {
        if (st.kind === "digit") {
          if (p.type === "add") {
            return st.da + " ＋ " + st.db + (st.carryIn ? " ＋ 1" : "") + " ＝ " + st.sum + " だよ。" +
              (st.sum >= 10
                ? st.sum + " の 1の位の " + st.expect + " を 書いて、1 を 次の位に くり上げます。もう一度 入れてみよう。"
                : "もう一度 入れてみよう。");
          }
          if (st.borrowed) {
            return "かりて " + st.topDigit + " に すると、" + st.topDigit + " － " + st.db +
              " ＝ " + st.expect + " だよ。もう一度 入れてみよう。";
          }
          return st.daEff + " － " + st.db + " ＝ " + st.expect + " だよ。もう一度 入れてみよう。";
        }
        if (st.kind === "intcalc") {
          return "おしい。整数の 計算と 同じだよ。" + st.x + (p.type === "mul" ? " × " : " ÷ ") +
            st.y + " を もう一度 計算してみよう。";
        }
        if (st.kind === "count") {
          return "おしい。" + fmt(p.a) + " の 小数点の 右側にある 数字の かずを、もう一度 数えてみよう。";
        }
        return "おしい。もう一度 やってみよう。";
      }

      function checkAnswer() {
        if (!session || session.busy) return;
        var p = currentProblem();
        var st = currentStep();
        if (!st) return;
        if (st.kind !== "digit" && st.kind !== "intcalc" && st.kind !== "count") return;
        if (session.stepInput === "") return;
        var val = parseInt(session.stepInput, 10);
        var ok = (val === st.expect);
        if (!ok) {
          markStepMistake();
          session.stepInput = "";
          if (st.kind === "digit") renderHissan(); else renderInput();
          var box = document.getElementById("answer-box");
          if (st.kind !== "digit") box.className = "answer-box bad";
          showFeedback("bad", "おしい！", stepWrongFeedback(st, p));
          return;
        }
        // 正解：ステップを進める
        session.busy = true;
        session.stepIndex += 1;
        if (st.kind === "digit") { session.stepInput = ""; renderHissan(); }
        var box2 = document.getElementById("answer-box");
        if (st.kind !== "digit") box2.className = "answer-box good";
        showFeedback("good", "せいかい！", stepCorrectFeedback(st, p));
        session.timer = setTimeout(function () {
          session.busy = false;
          session.stepInput = "";
          if (session.stepIndex >= currentProblem().steps.length) completeProblem();
          else renderStep();
        }, 950);
      }

      /* ---------- 問題の完了 ---------- */
      function completeProblem() {
        var p = currentProblem();
        session.busy = false;
        var flawless = !session.hadMistake;

        if (session.mode === "practice") {
          var stats = loadStats();
          stats[p.type].total += 1;
          if (flawless) stats[p.type].correct += 1;
          saveJSON(LS_STATS, stats);
        } else { // tokkun
          if (flawless) {
            var rest = loadMistakes().filter(function (m) {
              return !(m.type === p.type && m.expr === p.expr);
            });
            saveJSON(LS_MISTAKES, rest);
          }
        }
        if (flawless) session.correctCount += 1;

        document.getElementById("progress-fill").style.width =
          ((session.index + 1) / session.problems.length * 100) + "%";
        document.getElementById("btn-check").classList.add("hidden");
        document.getElementById("step-prompt").textContent = "";
        document.getElementById("step-label").textContent = "";
        document.getElementById("point-picker").classList.add("hidden");
        if (p.type === "add" || p.type === "sub") renderHissan();
        showFeedback("good", "できた！",
          p.expr + " ＝ " + fmt(p.answer) + "。" +
          (flawless ? "ぜんぶ 一度で できたね。すごい！" : "まちがえた ところも 直しながら 最後まで できたね。"));
        var nextBtn = document.getElementById("btn-next");
        nextBtn.classList.remove("hidden");
        nextBtn.textContent = (session.index + 1 >= session.problems.length) ? "けっかを 見る →" : "つぎの もんだいへ →";
      }

      function nextQuestion() {
        if (!session) return;
        clearTimer();
        session.index += 1;
        if (session.index >= session.problems.length) {
          finishSession();
        } else {
          renderQuestion();
        }
      }

      function finishSession() {
        var mistakes = loadMistakes();
        var title = document.getElementById("result-title");
        var msg = document.getElementById("result-msg");
        var againBtn = document.getElementById("btn-again");
        var tokkunBtn = document.getElementById("btn-result-tokkun");
        againBtn.classList.remove("hidden");
        tokkunBtn.classList.toggle("hidden", mistakes.length === 0);

        if (session.mode === "practice") {
          var n = session.problems.length;
          var c = session.correctCount;
          title.textContent = n + "もん中 " + c + "もん せいかい！";
          if (c === n) msg.textContent = "全問 正解！ すごいね。この調子で いろいろな 種類にも チャレンジしよう。";
          else if (c >= n * 0.7) msg.textContent = "よく がんばりました。まちがえた 問題は「とっくん」で もう一度 やってみよう。";
          else msg.textContent = "おつかれさま。まちがえた 問題は「とっくん」に 入っているよ。あわてず 1問ずつ 直していこう。";
          againBtn.textContent = "もう一度 れんしゅう";
        } else {
          var left = mistakes.length;
          title.textContent = session.correctCount + "もん 克服できた！";
          msg.textContent = left === 0
            ? "とっくん待ちの 問題が ぜんぶ なくなりました。全問 克服です！"
            : "あと " + left + "もん のこっています。また あとで チャレンジしよう。";
          againBtn.textContent = "もう一度 とっくん";
        }
        showView("view-result");
        renderTop();
      }

      /* ================= イベント ================= */
      document.getElementById("keypad").addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) return;
        pressKey(btn.getAttribute("data-key"));
      });
      document.getElementById("btn-check").addEventListener("click", checkAnswer);
      document.getElementById("btn-next").addEventListener("click", nextQuestion);
      document.getElementById("btn-quit").addEventListener("click", function () {
        clearTimer();
        session = null;
        renderTop();
        showView("view-top");
      });
      document.getElementById("btn-tokkun").addEventListener("click", startTokkun);
      document.getElementById("btn-records").addEventListener("click", function () {
        renderRecords();
        showView("view-records");
      });
      document.getElementById("btn-records-back").addEventListener("click", function () {
        renderTop();
        showView("view-top");
      });
      document.getElementById("btn-result-top").addEventListener("click", function () {
        clearTimer();
        session = null;
        renderTop();
        showView("view-top");
      });
      document.getElementById("btn-result-tokkun").addEventListener("click", startTokkun);
      document.getElementById("btn-again").addEventListener("click", function () {
        if (!session) { renderTop(); showView("view-top"); return; }
        if (session.mode === "practice") startPractice(session.type);
        else startTokkun();
      });

      renderTop();
    </script>
  </body>
</html>
